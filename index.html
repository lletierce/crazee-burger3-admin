<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <!--
      Couleur du tout premier affichage, avant le chargement du CSS et de React.
      Sans elle, le navigateur affiche une page blanche pendant le chargement,
      puis React peint le fond sombre d'un coup : un « flash » blanc au rafraîchissement.
      Ces couleurs doivent rester alignées sur le fond des pages
      (#f5f5f7 sur mobile, #1c1209 sur desktop : voir AuthLayout et PageBackground).
    -->
    <style>
      html { background-color: #f5f5f7; }
      @media (min-width: 48rem) {
        html { background-color: #1c1209; }
      }
    </style>

    <!-- Polices Google : chargées directement ici plutôt que via @import dans le CSS,
         pour que le navigateur les télécharge en parallèle au lieu d'attendre le CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Open+Sans:wght@500&display=swap" rel="stylesheet" />

    <link href="/src/App.css" rel="stylesheet">
    <title>crazee-burger-adm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
